server:
  port: 8080

spring:
  application:
    name: yourplan-backend

app:
  data-file-path: data.json
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
      - "https://*.vercel.app"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
